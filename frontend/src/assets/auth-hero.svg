<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0f9b8e"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d3c3"/><stop offset="1" stop-color="#0f9b8e"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".35"/></filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity=".28"/></filter>
  </defs>
  <!-- soft backdrop -->
  <circle cx="290" cy="270" r="215" fill="#ffffff" fill-opacity=".07"/>
  <circle cx="290" cy="270" r="150" fill="#ffffff" fill-opacity=".07"/>

  <!-- prescription card -->
  <g filter="url(#sh)">
    <rect x="80" y="70" width="320" height="380" rx="28" fill="#fff"/>
  </g>
  <rect x="80" y="70" width="320" height="86" rx="28" fill="url(#g1)"/>
  <rect x="80" y="128" width="320" height="28" fill="url(#g1)"/>
  <circle cx="124" cy="113" r="22" fill="#fff" fill-opacity=".95"/>
  <path d="M124 101v24M112 113h24" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
  <rect x="160" y="100" width="130" height="12" rx="6" fill="#fff"/>
  <rect x="160" y="120" width="86" height="10" rx="5" fill="#fff" fill-opacity=".6"/>
  <rect x="300" y="100" width="46" height="26" rx="13" fill="#fff" fill-opacity=".22"/>
  <text x="323" y="118" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Rx</text>

  <!-- rows -->
  <g>
    <rect x="108" y="184" width="264" height="64" rx="16" fill="#f1f5f9"/>
    <g transform="translate(120 196) rotate(-35 20 20)">
      <rect x="2" y="12" width="40" height="18" rx="9" fill="url(#g3)"/>
      <path d="M22 12h11a9 9 0 0 1 0 18H22z" fill="#fff"/>
    </g>
    <rect x="176" y="198" width="110" height="11" rx="5.5" fill="#0f172a" fill-opacity=".8"/>
    <rect x="176" y="218" width="150" height="9" rx="4.5" fill="#94a3b8"/>
    <circle cx="346" cy="216" r="11" fill="#dcfce7"/>
    <path d="M341 216l4 4 7-8" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <rect x="108" y="260" width="264" height="64" rx="16" fill="#f1f5f9"/>
    <circle cx="142" cy="292" r="19" fill="url(#g2)"/>
    <circle cx="142" cy="292" r="8" fill="#fff" fill-opacity=".85"/>
    <rect x="176" y="274" width="96" height="11" rx="5.5" fill="#0f172a" fill-opacity=".8"/>
    <rect x="176" y="294" width="132" height="9" rx="4.5" fill="#94a3b8"/>
    <circle cx="346" cy="292" r="11" fill="#dcfce7"/>
    <path d="M341 292l4 4 7-8" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <rect x="108" y="336" width="264" height="64" rx="16" fill="#f1f5f9"/>
    <rect x="124" y="352" width="34" height="34" rx="10" fill="#fde68a"/>
    <path d="M141 359v20M131 369h20" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
    <rect x="176" y="350" width="124" height="11" rx="5.5" fill="#0f172a" fill-opacity=".8"/>
    <rect x="176" y="370" width="100" height="9" rx="4.5" fill="#94a3b8"/>
    <rect x="316" y="358" width="42" height="20" rx="10" fill="#fef3c7"/>
    <text x="337" y="372" font-family="Inter,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">5 days</text>
  </g>
  <rect x="108" y="414" width="130" height="10" rx="5" fill="#e2e8f0"/>

  <!-- pulse card -->
  <g filter="url(#sh2)">
    <rect x="352" y="40" width="176" height="92" rx="20" fill="#fff"/>
  </g>
  <text x="372" y="68" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#64748b">HEART RATE</text>
  <path d="M370 100h26l10-20 14 38 12-30 8 12h40" stroke="url(#g1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- shield -->
  <g filter="url(#sh2)">
    <path d="M440 262l76 26v70c0 46-32 78-76 96-44-18-76-50-76-96v-70z" fill="url(#g2)"/>
  </g>
  <path d="M440 262l76 26v70c0 46-32 78-76 96z" fill="#fff" fill-opacity=".14"/>
  <path d="M440 322v62M409 353h62" stroke="#fff" stroke-width="13" stroke-linecap="round"/>

  <!-- OTP chip -->
  <g filter="url(#sh2)">
    <rect x="318" y="196" width="200" height="46" rx="23" fill="#fff"/>
  </g>
  <circle cx="344" cy="219" r="12" fill="#e0e7ff"/>
  <path d="M338 219h12M344 213v12" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/>
  <text x="366" y="224" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#0f172a" letter-spacing="2">4 8 2 9 1 7</text>

  <!-- loose capsules -->
  <g transform="translate(28 318) rotate(-28)">
    <rect width="78" height="30" rx="15" fill="url(#g3)"/>
    <path d="M39 0h24a15 15 0 0 1 0 30H39z" fill="#fff"/>
  </g>
  <g transform="translate(430 452) rotate(24)">
    <rect width="64" height="26" rx="13" fill="url(#g2)"/>
    <path d="M32 0h19a13 13 0 0 1 0 26H32z" fill="#fff"/>
  </g>
  <!-- sparkles -->
  <g stroke="#fff" stroke-opacity=".7" stroke-width="3" stroke-linecap="round">
    <path d="M40 120v16M32 128h16"/><path d="M510 190v12M504 196h12"/><path d="M60 450v12M54 456h12"/>
  </g>
  <circle cx="500" cy="420" r="5" fill="#7ff0e3"/><circle cx="48" cy="238" r="4" fill="#93c5fd"/><circle cx="262" cy="488" r="4" fill="#fff" fill-opacity=".6"/>
</svg>
